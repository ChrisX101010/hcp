[package]
name = "hcp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HCP command-line tool — build, simulate, and deploy hardware"

[[bin]]
name = "hcp"
path = "src/main.rs"

[dependencies]
hcp-core = { path = "../hcp-core" }
hcp-ecc = { path = "../hcp-ecc" }
hcp-hdl = { path = "../hcp-hdl" }
hcp-package = { path = "../hcp-package" }
hcp-protocol = { path = "../hcp-protocol" }
hcp-sim = { path = "../hcp-sim" }
hcp-fpga = { path = "../hcp-fpga", optional = true }

clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
indicatif.workspace = true
console.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
