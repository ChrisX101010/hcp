name: hcp-crypto

on:
  push:
    paths:
      - "crates/hcp-crypto/**"
      - ".github/workflows/hcp-crypto.yml"
  pull_request:
    paths:
      - "crates/hcp-crypto/**"
      - ".github/workflows/hcp-crypto.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, simulate, synthesize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install HDL toolchain
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys

      - name: Format check
        run: cargo fmt -p hcp-crypto -- --check

      - name: Clippy
        run: cargo clippy -p hcp-crypto --all-targets -- -D warnings

      - name: Test (RTL simulation is mandatory in CI)
        env:
          HCP_REQUIRE_IVERILOG: "1"
        run: cargo test -p hcp-crypto

      - name: Generated RTL is committed and up to date
        run: |
          cargo run -p hcp-crypto --example emit > /tmp/aes128_enc.sv
          diff -u crates/hcp-crypto/rtl/aes128_enc.sv /tmp/aes128_enc.sv \
            || { echo "::error::rtl/aes128_enc.sv is stale. Regenerate it."; exit 1; }

      - name: Synthesize for iCE40
        run: |
          yosys -p "read_verilog -sv crates/hcp-crypto/rtl/aes128_enc.sv; \
                    synth_ice40 -top aes128_enc; stat" 2>&1 \
            | awk '/=== aes128_enc ===/{n++} n==2' | head -20
